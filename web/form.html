<!DOCTYPE html>
    <html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма для визы</title>
</head>
<body>
    <h1>Форма для визы</h1>
    <form action="/form" method="post" enctype="multipart/form-data">
        <label for="name">Имя:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="surname">Фамилия:</label><br>
        <input type="text" id="surname" name="surname" required><br><br>

        <label for="sex">Пол</label><br>
        <select id="sex" name="sex">
            <option value="male">Мужчина</option>
            <option value="female">Женщина</option>
        </select>
        <br><br>

        <label for="ethnicity">Этничность</label><br>
        <input type="text" id="ethnicity" name="ethnicity" required><br><br>

        <label for="citizenship">Гражданство</label><br>
        <input type="text" id="citizenship" name="citizenship" required><br><br>

        <label for="purpose">Цель визита</label><br>
        <input type="text" id="purpose" name="purpose" required><br><br>

        <label for="photo">Фотография лица</label>
        <br>
        <input type="file" id="photo" name="photo" accept=".jpg, .jpeg, .png" required>
        <br><br>

        <button type="submit">Отправить</button>
    </form>
</body>
</html>
