<!DOCTYPE html>
    <html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус заявки</title>
    <script src="https://unpkg.com/htmx.org@1.9.4"></script>
</head>
<body>
    <h1>Проверить статус заявления</h1>
    <form hx-post="/status"
          hx-target="#request_status">
        <label for="request">Введите номер заявления</label><br>
        <input type="text" id="request" name="request" required><br><br>

        <button type="submit">Проверить</button>
    </form>
    <div id="request_status"></div>
</body>
</html>
