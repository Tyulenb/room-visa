<div class="visa-container">
  <div class="image">
      <img src="data:image/*;base64,{{.Photo}}" alt="lorem">
  </div>
  <div class="data">
      <h1>{{.Name}} {{.Surname}}</h1>
  </div>
  <div class="qr">
      <img src="data:image/*;base64,{{.QR}}" alt="lorem">
  </div>
</div>

<style>
  .visa-container {
      display: flex;
      width: 100%;
      height: 300px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      background-color: #fff;
      align-items: center;
  }

  .image img {
      width: 250px;
      height: 100%;
      border-radius: 8px 8px 8px 8px;
      object-fit: cover;
  }

  .data {
      padding: 15px;
      flex: 1 1 auto;
      margin-right: 20px; 
   }

  .data h1 {
      font-size: 30px;
      margin: 0 0 10px;
      color: #333;
  }

  .data ul {
      list-style: none;
      padding: 0;
  }
  
  .buttons {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 15px;
  }

  .buttons button {
      padding: 10px 15px;
      margin: 5px 0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-size: 1em;
      color: #fff;
  }

  .approve-button {
      background-color: #4CAF50;
  }

  .reject-button {
      background-color: #F44336;
  }

  .buttons button:hover {
      opacity: 0.9;
  }

  .qr img {
      width: 200px;
      height: 200px;
      border-radius: 8px 0 0 8px;
      object-fit: cover;
      align: center;
  }
</style>
